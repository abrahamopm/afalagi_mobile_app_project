# Optional Render Blueprint — adjust service name / repo as needed.
services:
  - type: web
    name: afalagi-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        value: admin@afalagi.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Afalagi Admin
      # Admin is created/updated on each deploy while MONGODB_URI is set.
      # Set SEED_ADMIN=false after first deploy to stop password resets on restart.
